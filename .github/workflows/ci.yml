name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Rust Data Plane (Linting, Formatting, Unit Testing, Compilation)
  # ---------------------------------------------------------------------------
  rust-dataplane:
    name: Rust Data Plane CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Protoc (Protobuf Compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            dataplane/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('dataplane/Cargo.lock', 'dataplane/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Code Formatting
        run: cargo fmt --check
        working-directory: dataplane

      - name: Run Clippy Linter
        run: cargo clippy -- -D warnings
        working-directory: dataplane

      - name: Run Unit Tests
        run: cargo test --verbose
        working-directory: dataplane

      - name: Build Release Binary
        run: cargo build --release
        working-directory: dataplane

  # ---------------------------------------------------------------------------
  # Job 2: Go Control Plane (Linting, Unit Testing, Race Detection, Compilation)
  # ---------------------------------------------------------------------------
  go-controlplane:
    name: Go Control Plane CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: controlplane/go.sum

      - name: Verify Go Formatting
        run: |
          UNFORMATTED=$(gofmt -l controlplane/ tools/ tests/)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...
        working-directory: controlplane

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...
        working-directory: controlplane

      - name: Build Control Plane Binaries
        run: |
          go build -v ./...
          go build -o /dev/null ./cmd/server
        working-directory: controlplane

  # ---------------------------------------------------------------------------
  # Job 3: Automated Disaster Recovery & E2E Failover Validation
  # ---------------------------------------------------------------------------
  e2e-failover-validation:
    name: Automated E2E Failover & Load Test
    runs-on: ubuntu-latest
    needs: [rust-dataplane, go-controlplane]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Automated Failover & Disaster Recovery Suite
        run: |
          chmod +x benchmarks/test_failover.sh
          ./benchmarks/test_failover.sh

  # ---------------------------------------------------------------------------
  # Job 4: Multi-Container Docker Compose Build Verification
  # ---------------------------------------------------------------------------
  docker-compose-build:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Build
        run: docker compose build
